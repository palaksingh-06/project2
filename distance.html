<html>
  <head>
    <title>Default getDistance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Default getDistance">

        <script src="https://sdk.mappls.com/map/sdk/web?v=3.0&access_token=lofjtuhjhkscynnqumfqikdxeaixcabrgyhu&callback=initMap1"></script>
          <script src="https://sdk.mappls.com/map/sdk/plugins?access_token=lofjtuhjhkscynnqumfqikdxeaixcabrgyhu&v=3.0"></script>
          <style>
        body { margin: 0; }
        #map {width: 100%; height: 100vh;margin: 0; padding: 0; }
    </style>
    </head>
    <body>
        <div id="map"></div>
             <script>
        var map;
        function initMap1() {
            map = new mappls.Map('map', {center:[28.638698386592438,77.27604556863412]});
        
            map.on('load',function(){
                mappls.getDistance({
                    coordinates: "518NSV;123ZRR;518NSV;123ZRR;28.9797,77.6763",
                },function callback (data) {
                    console.log("Data",data);
                    alert('Data: ' + JSON.stringify(data, null, 2));
                });
            }); 
            
        }   
          
    </script>
        </body>
  </html>
